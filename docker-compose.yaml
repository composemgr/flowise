# nginx proxy address - http://172.17.0.1:64174

name: flowise
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: flowiseai/flowise:latest
    container_name: flowise-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: flowise-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
      PORT: '3000'
      FLOWISE_USERNAME: ${APP_ADMIN_USER:-admin}
      FLOWISE_PASSWORD: ${APP_ADMIN_PASS:-replace-with-a-random-password}
      FLOWISE_SECRETKEY_OVERWRITE: ${APP_SECRET_KEY:-replace-with-a-random-32-character-secret}
      DATABASE_TYPE: ${DB_TYPE:-sqlite}
      DATABASE_PATH: /root/.flowise
      APIKEY_PATH: /root/.flowise
      SECRETKEY_PATH: /root/.flowise
      LOG_PATH: /root/.flowise/logs
    healthcheck:
      test: ['CMD', 'curl', '-s', '-o', '/dev/null', '--max-time', '5', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '172.17.0.1:64174:3000'
    volumes:
      - './volumes/data/flowise:/root/.flowise'
    networks:
      - flowise

networks:
  flowise:
    name: flowise
    external: false
